<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080d18"><title>Maç Analiz PRO LIVE</title>
<style>*{box-sizing:border-box}body{margin:0;background:#080d18;color:#eef3ff;font-family:Arial,sans-serif}header{padding:18px 15px;background:linear-gradient(135deg,#111b34,#080d18);position:sticky;top:0;z-index:4}h1{margin:0;font-size:22px}.sub{font-size:12px;color:#8fa0c0;margin-top:5px}main{max-width:760px;margin:auto;padding:12px}.card{background:#111a2d;border:1px solid #263552;border-radius:16px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.full{grid-column:1/-1}label{display:block;color:#a9b7d2;font-size:12px;margin-bottom:5px}input,select{width:100%;background:#0b1222;color:#fff;border:1px solid #2c3b5c;border-radius:10px;padding:11px}button{border:0;border-radius:11px;padding:12px;background:#4f8cff;color:#fff;font-weight:700;width:100%}.row{display:flex;gap:8px}.row>*{flex:1}.muted{color:#8e9cb8;font-size:13px}.fixture{padding:12px;border:1px solid #263552;border-radius:12px;margin:8px 0;cursor:pointer}.fixture b{display:block;margin-bottom:5px}.pill{display:inline-block;background:#1d2d4c;color:#b9d3ff;border-radius:20px;padding:4px 8px;font-size:11px}.metric{display:flex;justify-content:space-between;border-bottom:1px solid #24304a;padding:10px 0}.metric:last-child{border:0}.bar{height:8px;background:#222e47;border-radius:9px;margin:5px 0 10px;overflow:hidden}.bar i{display:block;height:100%;background:#4f8cff}.ok{color:#6ee7a8}.warn{color:#ffd166}.err{color:#ff8090}.hidden{display:none}</style></head><body>
<header><h1>⚽ Maç Analiz PRO LIVE</h1><div class="sub">Canlı futbol verisi + istatistiksel model</div></header><main>
<div class="card"><div class="grid"><div class="full"><label>API-Football anahtarı</label><input id="key" type="password" placeholder="API anahtarını gir"></div><div><label>Lig ID</label><input id="league" value="39"></div><div><label>Sezon</label><input id="season" value="2026"></div><div class="full"><button onclick="loadFixtures()">BUGÜNÜN MAÇLARINI GETİR</button></div></div><p id="status" class="muted"></p></div>
<div id="fixtures" class="card"><h3>Maçlar</h3><p class="muted">API anahtarını girip maçları getir.</p></div>
<div id="analysis"></div>
<div id="extra"></div>
<div class="card"><h3>Model</h3><p class="muted">Uygulama son maçlar, ev/deplasman performansı ve gol ortalamalarından Poisson tabanlı olasılıklar üretir. Bu sonuçlar kesin tahmin değildir.</p></div>
</main>
<script>
const $=x=>document.getElementById(x); $('key').value=localStorage.getItem('afkey')||'';
const base='https://v3.football.api-sports.io';
let cbSeq=0, pending={};
window.__nativeApiDone=function(id,res){let p=pending[id];if(!p)return;delete pending[id];if(!res.ok){p.reject(Error('HTTP '+res.status+' — '+res.body));return}try{let j=JSON.parse(res.body);if(j.errors&&Object.keys(j.errors).length){p.reject(Error(JSON.stringify(j.errors)));return}p.resolve(j)}catch(e){p.reject(Error('API yanıtı okunamadı: '+e.message))}};
function nativeGet(url,key){return new Promise((resolve,reject)=>{let id='c'+(++cbSeq);pending[id]={resolve,reject};if(window.AndroidApi){AndroidApi.get(url,key,id)}else{reject(new Error('Bu sayfa tarayıcıda açıldı. Maç Analiz PRO APK'sını kurup uygulama içinden çalıştırın.'))}})}
async function api(path){let key=$('key').value.trim();if(!key)throw Error('API anahtarı gerekli');localStorage.setItem('afkey',key);return await nativeGet(base+path,key)}
async function loadFixtures(){ $('status').textContent='Veriler getiriliyor...';try{let d=new Date(),date=d.toISOString().slice(0,10),league=$('league').value,season=$('season').value;let j=await api(`/fixtures?league=${league}&season=${season}&date=${date}&timezone=Europe/Istanbul`);let a=j.response||[];$('fixtures').innerHTML='<h3>Bugünün maçları</h3>'+ (a.length?a.map(x=>`<div class="fixture" onclick="selectMatch(${x.fixture.id},${x.teams.home.id},${x.teams.away.id},'${esc(x.teams.home.name)}','${esc(x.teams.away.name)}')"><b>${esc(x.teams.home.name)} - ${esc(x.teams.away.name)}</b><span class="pill">${x.fixture.status.short} • ${new Date(x.fixture.date).toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})}</span></div>`).join(''):'<p class="muted">Bu tarih/lig için maç bulunamadı.</p>');$('status').textContent=`${a.length} maç bulundu.`}catch(e){$('status').innerHTML='<span class="err">'+esc(e.message)+'</span>'}}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function selectMatch(fid,hid,aid,hn,an){$('analysis').innerHTML='<div class="card"><h3>'+hn+' - '+an+'</h3><p class="muted">Form, sakatlıklar, kadro, maç istatistikleri ve oranlar hazırlanıyor...</p></div>';try{
 let league=$('league').value,season=$('season').value;
 let req=[
  api(`/teams/statistics?league=${league}&season=${season}&team=${hid}`),
  api(`/teams/statistics?league=${league}&season=${season}&team=${aid}`),
  api(`/fixtures/headtohead?h2h=${hid}-${aid}&last=10`),
  api(`/predictions?fixture=${fid}`),
  api(`/injuries?fixture=${fid}`),
  api(`/fixtures/lineups?fixture=${fid}`),
  api(`/odds?fixture=${fid}`),
  api(`/fixtures/statistics?fixture=${fid}`)
 ];
 let [hs,as,h2h,pred,inj,lineups,odds,stats]=await Promise.all(req);
 let H=hs.response||{},A=as.response||{},p=(pred.response||[])[0]||{};
 let hg=avg(H.goals?.for?.total),ag=avg(A.goals?.for?.total),hc=avg(H.goals?.against?.total),ac=avg(A.goals?.against?.total);
 let lh=Math.max(.05,(hg+ac)/2),la=Math.max(.05,(ag+hc)/2),out=calc(lh,la);
 let hp=p.predictions?.percent?.home||'-',dp=p.predictions?.percent?.draw||'-',ap=p.predictions?.percent?.away||'-';
 let injA=(inj.response||[]),line=(lineups.response||[]),od=(odds.response||[]),st=(stats.response||[]);
 $('analysis').innerHTML=`<div class="card"><h2>${hn} - ${an}</h2>
 <div class="metric"><span>Model 1/X/2</span><b>${out.H.toFixed(1)}% / ${out.D.toFixed(1)}% / ${out.A.toFixed(1)}%</b></div>
 <div class="metric"><span>Beklenen gol</span><b>${lh.toFixed(2)} - ${la.toFixed(2)}</b></div>
 <div class="metric"><span>2.5 Üst</span><b>${out.O.toFixed(1)}%</b></div>
 <div class="metric"><span>KG Var</span><b>${out.B.toFixed(1)}%</b></div>
 <div class="metric"><span>API 1/X/2</span><b>${hp} / ${dp} / ${ap}</b></div></div>
 <div class="card"><h3>📊 Takım karşılaştırması</h3>
 <div class="metric"><span>${hn} gol ortalaması</span><b>${hg.toFixed(2)}</b></div>
 <div class="metric"><span>${an} gol ortalaması</span><b>${ag.toFixed(2)}</b></div>
 <div class="metric"><span>${hn} yediği gol</span><b>${hc.toFixed(2)}</b></div>
 <div class="metric"><span>${an} yediği gol</span><b>${ac.toFixed(2)}</b></div>
 <div class="metric"><span>H2H son 10</span><b>${(h2h.response||[]).length}</b></div></div>`;

 renderInjuries(injA,hn,an);
 renderLineups(line);
 renderOdds(od);
 renderStats(st,hn,an);
 }catch(e){$('analysis').innerHTML='<div class="card"><span class="err">Veri alınırken hata: '+esc(e.message)+'</span><p class="muted">Bazı liglerde sakatlık, kadro veya oran verisi bulunmayabilir. Bu durumda analiz yine temel verilerle çalıştırılabilir.</p></div>'; try{basicOnly(fid,hid,aid,hn,an)}catch(_){} }}

async function basicOnly(fid,hid,aid,hn,an){try{
 let [hs,as,pred]=await Promise.all([api(`/teams/statistics?league=${$('league').value}&season=${$('season').value}&team=${hid}`),api(`/teams/statistics?league=${$('league').value}&season=${$('season').value}&team=${aid}`),api(`/predictions?fixture=${fid}`)]);
 let H=hs.response||{},A=as.response||{},hg=avg(H.goals?.for?.total),ag=avg(A.goals?.for?.total),hc=avg(H.goals?.against?.total),ac=avg(A.goals?.against?.total);
 let o=calc(Math.max(.05,(hg+ac)/2),Math.max(.05,(ag+hc)/2)),pp=(pred.response||[])[0]?.predictions||{};
 $('analysis').innerHTML=`<div class="card"><h2>${hn} - ${an}</h2><div class="metric"><span>Model 1/X/2</span><b>${o.H.toFixed(1)}% / ${o.D.toFixed(1)}% / ${o.A.toFixed(1)}%</b></div><div class="metric"><span>2.5 Üst</span><b>${o.O.toFixed(1)}%</b></div><div class="metric"><span>KG Var</span><b>${o.B.toFixed(1)}%</b></div><div class="metric"><span>API tahmini</span><b>${pp.percent?.home||'-'} / ${pp.percent?.draw||'-'} / ${pp.percent?.away||'-'}</b></div></div>`;
 }catch(e){}}

function renderInjuries(a,hn,an){
 let h=a.filter(x=>x.team?.name===hn),d=a.filter(x=>x.team?.name===an);
 const block=(arr,name)=>`<div class="metric"><span><b>${esc(name)}</b><br><small>${arr.length?arr.map(x=>esc(x.player?.name||'Oyuncu')+' — '+esc(x.type||'')+' '+esc(x.reason||'')).join('<br>'):'Eksik/sakatlık verisi yok'}</small></span><b>${arr.length}</b></div>`;
 $('extra').innerHTML=`<div class="card"><h3>🚑 Sakat / Cezalı</h3>${block(h,hn)}${block(d,an)}</div>`;
}
function renderLineups(a){
 let x=a[0],html='<div class="card"><h3>👥 Kadro / Formasyon</h3>';
 if(!x){html+='<p class="muted">Kadrolar henüz açıklanmamış olabilir.</p></div>';$('extra').innerHTML+=html;return}
 ['home','away'].forEach(k=>{let t=x.teams?.[k],st=x.startXI||x.startingXI||[]; if(t)html+=`<div class="metric"><span>${esc(t.name||k)} formasyon</span><b>${esc(t.formation||'-')}</b></div>`});
 html+='<p class="muted">Başlangıç 11 bilgisi API tarafından maçtan önce yayınlandığında burada gösterilir.</p></div>';
 $('extra').innerHTML+=html;
}
function renderOdds(a){
 let html='<div class="card"><h3>💹 Oran karşılaştırması</h3>';
 if(!a.length){html+='<p class="muted">Bu maç için oran verisi bulunamadı.</p>'}
 else {let shown=a.slice(0,8); shown.forEach(x=>{let b=x.bookmakers?.[0]; if(b){html+=`<div class="metric"><span>${esc(b.name||'Bookmaker')}</span><b>${esc((b.bets||[]).slice(0,1).map(z=>z.name).join(', ')||'-')}</b></div>`}})}
 html+='</div>'; $('extra').innerHTML+=html;
}
function renderStats(a,hn,an){
 let html='<div class="card"><h3>📈 Maç istatistikleri</h3>';
 if(!a.length){html+='<p class="muted">Maç başlamadıysa canlı istatistikler henüz olmayabilir.</p>'}
 else {a.forEach(t=>{html+=`<h4>${esc(t.team?.name||'Takım')}</h4>`;(t.statistics||[]).forEach(q=>{let v=q.value==null?'-':q.value;html+=`<div class="metric"><span>${esc(q.type)}</span><b>${esc(v)}</b></div>`})})}
 html+='</div>'; $('extra').innerHTML+=html;
}
function avg(o){if(!o)return 0;return Number(o.average||o.total||0)||0}
function fact(n){let x=1;for(let i=2;i<=n;i++)x*=i;return x}
function calc(lh,la){let m=[],H=0,D=0,A=0,O=0,B=0,N=0;for(let h=0;h<=7;h++)for(let a=0;a<=7;a++){let p=Math.exp(-lh)*Math.pow(lh,h)/fact(h)*Math.exp(-la)*Math.pow(la,a)/fact(a);N+=p;if(h>a)H+=p;else if(h==a)D+=p;else A+=p;if(h+a>2)O+=p;if(h>0&&a>0)B+=p}return{H:H/N*100,D:D/N*100,A:A/N*100,O:O/N*100,B:B/N*100}}
</script></body></html>
